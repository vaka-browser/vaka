<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Krypto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --terra: #e08a62; --terra-deep: #c2643f; --terra-soft: #f2b795; --ink: #f2f2f4; --dim: #9a9ca3; --line: rgba(255,255,255,.08);
    --bg: #0b0b0d; --card: #151517; --card-2: #1c1c20; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(90% 40% at 50% -10%, rgba(224,138,98,.16), transparent 70%), var(--bg);
    display: flex; flex-direction: column; height: 100%; overflow: hidden;
  }
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 13px 12px;
    border-bottom: 1px solid var(--line); background: rgba(11,11,13,.7); backdrop-filter: blur(10px); position: relative; z-index: 5;
  }
  header .dot { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
    background: rgba(224,138,98,.14); border: 1px solid rgba(224,138,98,.3); color: var(--terra); }
  /* Ugglan: Kryptos märke (Vaka = hålla vakt). Ansiktet i små ytor, hela ugglan
     i välkomstvyn och när Krypto tänker: då flyger den och tittar runt. */
  .owl { display: block; width: 22px; height: 22px; object-fit: contain; transform-origin: 50% 60%; }
  header .dot { background: transparent; border-color: transparent; overflow: visible; }
  body.thinking header .dot { background: rgba(224,138,98,.16); border-color: rgba(224,138,98,.45); box-shadow: 0 0 0 4px rgba(224,138,98,.08), 0 0 22px rgba(224,138,98,.35); }
  body.thinking header .owl { animation: owl-peek 2.2s ease-in-out infinite; }
  @keyframes owl-peek {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    20% { transform: rotate(-12deg) translateX(-1px) translateY(-1px); }
    40% { transform: rotate(-12deg) translateX(-1px) translateY(-1px); }
    60% { transform: rotate(12deg) translateX(1px) translateY(-1px); }
    80% { transform: rotate(12deg) translateX(1px) translateY(-1px); }
  }
  .think { display: inline-flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; }
  .think .owl-fly { width: 34px; height: 34px; object-fit: contain; transform-origin: 50% 55%; animation: owl-fly 2.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 8px rgba(224,138,98,.35)); }
  /* Flyger: lyfter, lutar och kikar åt vänster, sedan åt höger, landar mjukt. */
  @keyframes owl-fly {
    0%   { transform: translateY(0) rotate(0deg) scale(1); }
    18%  { transform: translateY(-7px) translateX(-3px) rotate(-10deg) scale(1.04); }
    36%  { transform: translateY(-4px) translateX(-4px) rotate(-6deg) scale(1.02); }
    50%  { transform: translateY(-8px) translateX(0) rotate(0deg) scale(1.05); }
    64%  { transform: translateY(-4px) translateX(4px) rotate(6deg) scale(1.02); }
    82%  { transform: translateY(-7px) translateX(3px) rotate(10deg) scale(1.04); }
    100% { transform: translateY(0) rotate(0deg) scale(1); }
  }
  .think .tt { background: linear-gradient(90deg, #9a9ca3 0%, #f2f2f4 50%, #9a9ca3 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  header .t { font-weight: 700; font-size: 14.5px; letter-spacing: .2px; overflow: hidden; }
  header .t small { display: block; font-weight: 500; font-size: 11px; color: var(--dim); letter-spacing: 0; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 150px; }
  header .grow { flex: 1; }
  .hbtn { position: relative; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; cursor: pointer;
    color: var(--dim); background: transparent; border: 1px solid transparent; }
  .hbtn:hover { background: rgba(255,255,255,.07); color: var(--ink); border-color: var(--line); }
  .hbtn .badge { position: absolute; top: -3px; right: -3px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
    background: var(--terra); color: #1a0d04; font-size: 9.5px; font-weight: 800; display: none; align-items: center; justify-content: center; line-height: 15px; }
  .hbtn .badge.on { display: flex; }
  #log { flex: 1; overflow-y: auto; padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 12px; }
  #log > * { flex: 0 0 auto; }   /* annars krymper flex-barnen när loggen svämmar över → sista kortet klipps */
  .msg { display: flex; gap: 9px; max-width: 100%; }
  .msg .av { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; }
  .msg.krypto .av { background: rgba(224,138,98,.14); color: var(--terra); border: 1px solid rgba(224,138,98,.28); }
  .msg .bubble { padding: 11px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; animation: msgin .32s cubic-bezier(.16,1,.3,1) both; }
  @keyframes msgin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.krypto .bubble { background: var(--card); border: 1px solid #26262b; border-top-left-radius: 5px; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .bubble { background: linear-gradient(180deg, #e9976f, var(--terra-deep)); color: #1a0d04; border-top-right-radius: 5px; box-shadow: 0 6px 18px rgba(194,100,63,.25); }
  .msg.user .av { background: var(--card-2); color: var(--ink); border: 1px solid #2a2a2e; }
  .typing .bubble { color: var(--dim); padding: 9px 13px; }
  /* Välkomstvy när samtalet är tomt */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 28px 10px 10px; gap: 10px; animation: msgin .5s cubic-bezier(.16,1,.3,1) both; }
  .hero .big { position: relative; width: 116px; height: 116px; display: grid; place-items: center; }
  .hero .big img { width: 104px; height: 104px; object-fit: contain; position: relative; z-index: 1; transform-origin: 50% 60%;
    animation: owl-idle 5s ease-in-out infinite; filter: drop-shadow(0 10px 18px rgba(224,138,98,.35)); }
  .hero .big::before { content: ""; position: absolute; inset: 10px; border-radius: 999px; background: radial-gradient(circle, rgba(224,138,98,.28), transparent 68%); filter: blur(6px); }
  .hero .big::after { content: ""; position: absolute; left: 30px; right: 30px; bottom: 2px; height: 8px; border-radius: 999px; background: rgba(224,138,98,.35); filter: blur(4px);
    animation: owl-shadow 5s ease-in-out infinite; }
  /* I vila: svävar lätt och kikar då och då åt sidan. */
  @keyframes owl-idle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30% { transform: translateY(-5px) rotate(-5deg); }
    50% { transform: translateY(-3px) rotate(0deg); }
    70% { transform: translateY(-5px) rotate(5deg); }
  }
  @keyframes owl-shadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.8); opacity: .55; } }
  .hero h1 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
  .hero p { font-size: 13px; color: var(--dim); max-width: 34ch; line-height: 1.5; }
  .sugg { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 360px; margin-top: 10px; }
  .sugg button { text-align: left; font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid #26262b; border-radius: 12px; padding: 10px 13px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .sugg button:hover { border-color: rgba(224,138,98,.5); background: var(--card-2); }
  .sugg button span { color: var(--terra); }
  .dots span { display: inline-block; width: 5px; height: 5px; margin: 0 1.5px; border-radius: 50%; background: var(--dim); animation: b 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .18s; } .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes b { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  /* Minneskort + animationer */
  .memcard { display: flex; gap: 10px; align-items: center; align-self: stretch; padding: 10px 12px; border-radius: 12px; font-size: 12.5px;
    background: rgba(224,138,98,.16); border: 1px solid rgba(224,138,98,.42); color: #fbe7db; box-shadow: 0 6px 20px rgba(194,100,63,.22);
    transform-origin: center; animation: memin .5s cubic-bezier(.2,.85,.25,1) both; overflow: hidden; }
  .memcard .mi { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--terra);
    background: rgba(224,138,98,.16); animation: mipulse 1.1s ease-out both; }
  .memcard .mtxt b { display: block; font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--terra); margin-bottom: 1px; }
  .memcard.del { background: rgba(255,120,120,.09); border-color: rgba(255,120,120,.28); color: #f2c8c8; }
  .memcard.del .mi { color: #ff9a9a; background: rgba(255,120,120,.14); }
  .memcard.del .mtxt b { color: #ff9a9a; }
  .memcard.del .mval { text-decoration: line-through; opacity: .85; }
  @keyframes memin { 0% { opacity: 0; transform: translateY(8px) scale(.92); } 60% { transform: translateY(0) scale(1.02); } 100% { opacity: 1; transform: none; } }
  @keyframes mipulse { 0% { transform: scale(.6); box-shadow: 0 0 0 0 rgba(224,138,98,.55); } 70% { box-shadow: 0 0 0 12px rgba(224,138,98,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(224,138,98,0); } }
  .memcard.leaving { animation: memout .45s ease-in forwards; }
  @keyframes memout { to { opacity: 0; transform: translateX(14px) scale(.94); } }
  .recall { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 600; color: var(--terra);
    background: rgba(224,138,98,.1); border: 1px solid rgba(224,138,98,.25); padding: 3px 10px; border-radius: 999px; animation: memin .4s both; }
  .recall svg { animation: mipulse 1.1s ease-out both; }

  /* Sido-paneler (minne + samtal) */
  .panel { position: absolute; inset: 0; top: 57px; background: var(--bg); z-index: 8; display: none; flex-direction: column; }
  .panel.on { display: flex; }
  .panel .p-head { padding: 13px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .panel .p-head .t { font-weight: 700; font-size: 14px; }
  .panel .p-head .sub { font-size: 11.5px; color: var(--dim); }
  .p-list { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .p-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 30px 16px; line-height: 1.5; }

  /* Minnesrader */
  .mprow { display: flex; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 11px; background: var(--card); border: 1px solid #26262b; font-size: 13px; animation: memin .3s both; }
  .mprow .mv { flex: 1; line-height: 1.4; outline: none; padding: 2px 3px; border-radius: 6px; }
  .mprow .mv[contenteditable="true"] { background: rgba(0,0,0,.25); box-shadow: inset 0 0 0 1px rgba(224,138,98,.5); cursor: text; }
  .mprow .ib { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; border: 0; cursor: pointer; background: transparent; color: var(--dim); display: grid; place-items: center; }
  .mprow .ib:hover { background: rgba(255,255,255,.08); color: var(--ink); }
  .mprow .ib.del:hover { background: rgba(255,120,120,.14); color: #ff9a9a; }
  .mprow.leaving { animation: memout .4s ease-in forwards; }
  .mp-add { flex: 0 0 auto; padding: 10px 14px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .mp-add input { flex: 1; background: var(--card-2); border: 1px solid #2f2f34; border-radius: 10px; padding: 9px 11px; color: var(--ink); font-size: 13px; outline: none; }
  .mp-add input:focus { border-color: rgba(224,138,98,.5); }
  .mp-add input::placeholder { color: #6f6f76; }
  .mp-add button { flex: 0 0 auto; width: 38px; border-radius: 10px; border: 0; cursor: pointer; background: linear-gradient(180deg, #e9976f, var(--terra-deep)); color: #1a0d04; display: grid; place-items: center; }

  /* Samtalsrader */
  .convrow { display: flex; gap: 10px; align-items: center; padding: 11px 11px; border-radius: 11px; background: var(--card); border: 1px solid #26262b; cursor: pointer; animation: memin .3s both; }
  .convrow:hover { background: rgba(255,255,255,.07); }
  .convrow.active { border-color: rgba(224,138,98,.5); background: rgba(224,138,98,.10); }
  .convrow .ci { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--terra); background: rgba(224,138,98,.14); }
  .convrow .cmeta { flex: 1; min-width: 0; }
  .convrow .ctitle { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .convrow .csub { font-size: 11px; color: var(--dim); margin-top: 1px; }
  .convrow .del { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; border: 0; cursor: pointer; background: transparent; color: var(--dim); display: grid; place-items: center; }
  .convrow .del:hover { background: rgba(255,120,120,.14); color: #ff9a9a; }
  .p-newbtn { margin: 12px 14px 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border-radius: 11px; cursor: pointer;
    border: 1px dashed rgba(224,138,98,.4); color: var(--terra); background: rgba(224,138,98,.06); font-size: 13.5px; font-weight: 600; }
  .p-newbtn:hover { background: rgba(224,138,98,.12); }

  footer { flex: 0 0 auto; padding: 10px 12px 12px; border-top: 1px solid var(--line); background: rgba(11,11,13,.85); position: relative; }
  /* Kommando-hint */
  #cmdhint { position: absolute; left: 12px; right: 12px; bottom: calc(100% + 6px); background: var(--card); border: 1px solid #2f2f34; border-radius: 12px; overflow: hidden; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #cmdhint.on { display: block; }
  .cmd { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; }
  .cmd:hover, .cmd.sel { background: rgba(224,138,98,.12); }
  .cmd .cname { font-weight: 700; color: var(--terra); font-size: 13px; font-family: ui-monospace, monospace; }
  .cmd .cdesc { color: var(--dim); font-size: 12px; }
  .inwrap { display: flex; align-items: flex-end; gap: 8px; background: var(--card); border: 1px solid #2a2a2e; border-radius: 16px; padding: 7px 7px 7px 14px; transition: border-color .15s, box-shadow .15s; }
  .inwrap:focus-within { border-color: rgba(224,138,98,.6); box-shadow: 0 0 0 3px rgba(224,138,98,.12); }
  #inp { flex: 1; background: transparent; border: 0; outline: none; color: var(--ink); font-size: 13.5px; line-height: 1.45;
    resize: none; max-height: 120px; font-family: inherit; padding: 3px 0; }
  #inp::placeholder { color: #6f6f76; }
  #send { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 999px; border: 0; cursor: pointer;
    background: linear-gradient(180deg, #e9976f, var(--terra-deep)); color: #1a0d04; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(194,100,63,.3); }
  #send:disabled { opacity: .4; cursor: default; }
  #send:active:not(:disabled) { transform: translateY(1px); }
  .foot-note { text-align: center; font-size: 10.5px; color: #6f6f76; margin-top: 7px; }
  /* Läges-chips */
  #modes { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
  #modes::-webkit-scrollbar { display: none; }
  .modechip { flex: 0 0 auto; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; cursor: pointer;
    background: var(--card); border: 1px solid #2a2a2e; color: #c9ccd2; white-space: nowrap; transition: all .12s; }
  .modechip:hover { border-color: rgba(224,138,98,.5); color: var(--ink); }
  .modechip.on { background: linear-gradient(180deg, #e9976f, var(--terra-deep)); border-color: transparent; color: #1a0d04; }
  /* Helskärm: håll chatt-kolumnen lagom bred och centrerad i stället för utsträckt. */
  body.full #log { max-width: 860px; margin: 0 auto; width: 100%; }
  body.full #modes, body.full .inwrap, body.full .foot-note { max-width: 860px; margin-left: auto; margin-right: auto; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
</style>
<style>#modes{display:none}</style>
</head>
<body>
  <header>
    <span class="dot" id="hdr-dot"><img class="owl" src="krypto-owl-face.png" alt=""></span>
    <span class="t">Krypto<small id="convtitle">Din säkerhetsassistent</small></span>
    <span class="grow"></span>
    <button class="hbtn" id="fullbtn" title="Helskärm">
      <svg id="full-ic-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      <svg id="full-ic-close" style="display:none" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>
    <button class="hbtn" id="convbtn" title="Alla samtal (/samtal)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
    </button>
    <button class="hbtn" id="membtn" title="Vad Krypto minns (/minne)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 0 0-5.9-.6A3 3 0 0 0 4 9.5a3 3 0 0 0 0 5A3 3 0 0 0 8 19a3 3 0 0 0 4 1 3 3 0 0 0 4-1 3 3 0 0 0 4-4.5 3 3 0 0 0 0-5A3 3 0 0 0 17.9 4.4 3 3 0 0 0 12 5Z"/><path d="M12 5v15"/></svg>
      <span class="badge" id="membadge">0</span>
    </button>
    <button class="hbtn" id="newchat" title="Nytt samtal (/nytt)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <div id="log"></div>

  <!-- Samtalslista -->
  <div id="convpanel" class="panel">
    <div class="p-head">
      <div style="flex:1"><div class="t">Samtal</div><div class="sub">Fortsätt ett tidigare samtal.</div></div>
      <button class="hbtn" id="convclose" title="Stäng"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <button class="p-newbtn" id="conv-new"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Nytt samtal</button>
    <div class="p-list" id="convlist"></div>
  </div>

  <!-- Minne -->
  <div id="mempanel" class="panel">
    <div class="p-head">
      <div style="flex:1"><div class="t">Krypto minns</div><div class="sub">Ändra, ta bort eller lägg till själv.</div></div>
      <button class="hbtn" id="memclose" title="Stäng"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="p-list" id="mplist"></div>
    <div class="mp-add">
      <input id="memadd-inp" type="text" placeholder="Lägg till ett minne själv…" spellcheck="false" />
      <button id="memadd-btn" title="Lägg till"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>

  <footer>
    <div id="cmdhint"></div>
    <div id="modes">
      <button class="modechip on" data-mode="fraga">Fråga</button>
      <button class="modechip" data-mode="rapport">Skriv rapport</button>
      <button class="modechip" data-mode="skicka">Skicka in</button>
      <button class="modechip" data-mode="kritik">Kritik</button>
    </div>
    <div class="inwrap">
      <textarea id="inp" rows="1" placeholder="Fråga Krypto — eller skriv / för kommandon" spellcheck="false"></textarea>
      <button id="send" title="Skicka">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </div>
    <div class="foot-note">Krypto kan ha fel. Dela aldrig lösenord eller BankID.</div>
  </footer>

  <script src="i18n.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = $('log'), inp = $('inp'), sendBtn = $('send');
    const MEM = 'krypto-memories', CONV = 'krypto-convos', HIST = 'krypto-chat-history';
    let busy = false;

    /* ── Samtal ── */
    let convos = [], activeId = null, history = [];
    function loadConvos() {
      try { const o = JSON.parse(localStorage.getItem(CONV)); if (o && Array.isArray(o.list)) { convos = o.list; activeId = o.activeId; } } catch {}
      if (!convos.length) {
        let old = []; try { const h = JSON.parse(localStorage.getItem(HIST)); if (Array.isArray(h)) old = h; } catch {}
        const c = { id: cid(), title: titleFrom(old), ts: Date.now(), messages: old, mode: 'fraga' };
        convos = [c]; activeId = c.id; saveConvos();
      }
      if (!activeConvo()) activeId = convos[convos.length - 1].id;
      history = activeConvo().messages;
    }
    function cid() { return 'c' + Date.now() + Math.floor(Math.random() * 1000); }
    function titleFrom(msgs) { const u = (msgs || []).find((m) => m.role === 'user'); return u ? u.content.slice(0, 44) : 'Nytt samtal'; }
    function saveConvos() { try { localStorage.setItem(CONV, JSON.stringify({ list: convos.slice(-50), activeId })); } catch {} }
    function activeConvo() { return convos.find((c) => c.id === activeId); }
    function newConvo() {
      const c = { id: cid(), title: 'Nytt samtal', ts: Date.now(), messages: [], mode: (typeof kMode !== 'undefined' ? kMode : 'fraga') };
      convos.push(c); activeId = c.id; history = c.messages; saveConvos();
      updateConvTitle(); render(); closePanels(); inp.focus();
    }
    function openConvo(id) {
      const c = convos.find((x) => x.id === id); if (!c) return;
      activeId = id; history = c.messages; saveConvos();
      if (typeof applyModeUI === 'function') applyModeUI(c.mode || 'fraga');
      updateConvTitle(); render(); closePanels();
    }
    function deleteConvo(id) {
      convos = convos.filter((c) => c.id !== id);
      if (!convos.length) { newConvo(); return; }
      if (activeId === id) { activeId = convos[convos.length - 1].id; history = activeConvo().messages; updateConvTitle(); render(); }
      saveConvos(); renderConvList();
    }
    function touchConvo(text) {
      const c = activeConvo(); if (!c) return;
      if (!c.title || c.title === 'Nytt samtal') c.title = (text || '').slice(0, 44) || 'Nytt samtal';
      c.ts = Date.now();
    }
    function updateConvTitle() { const c = activeConvo(); $('convtitle').textContent = (c && c.messages.length) ? (c.title || 'Samtal') : 'Din säkerhetsassistent'; }

    /* ── Minne ── */
    function memGet() { try { const m = JSON.parse(localStorage.getItem(MEM)); return Array.isArray(m) ? m : []; } catch { return []; } }
    function memSet(list) { try { localStorage.setItem(MEM, JSON.stringify(list.slice(-80))); } catch {} updateBadge(); }
    function memAdd(text) {
      text = (text || '').trim(); if (!text) return null;
      const list = memGet();
      if (list.some((m) => m.text.toLowerCase() === text.toLowerCase())) return null;
      const rec = { id: 'm' + Date.now() + Math.floor(Math.random() * 1000), text, ts: Date.now() };
      list.push(rec); memSet(list); return rec;
    }
    function memDelByText(needle) {
      needle = (needle || '').trim().toLowerCase(); if (!needle) return null;
      const list = memGet();
      let idx = list.findIndex((m) => m.text.toLowerCase() === needle);
      if (idx < 0) idx = list.findIndex((m) => m.text.toLowerCase().includes(needle) || needle.includes(m.text.toLowerCase()));
      if (idx < 0) return null;
      const [rec] = list.splice(idx, 1); memSet(list); return rec;
    }
    function memDelById(id) { memSet(memGet().filter((m) => m.id !== id)); }
    function memEdit(id, text) { const list = memGet(); const m = list.find((x) => x.id === id); if (m) { m.text = (text || '').trim(); memSet(list.filter((x) => x.text)); } }
    function updateBadge() { const n = memGet().length; const b = $('membadge'); b.textContent = n; b.classList.toggle('on', n > 0); if ($('mempanel').classList.contains('on')) renderMemList(); }

    const MODE_LABEL = { fraga: 'Fråga', rapport: 'Skriv rapport', skicka: 'Skicka in', kritik: 'Kritik' };
    const MODE_INTRO = {

      kritik: 'Läge: <b>Kritik</b> — klistra in din rapport så granskar jag den hårt som en triager innan du skickar in.',
    };
    let kMode = 'fraga';
    try { const m = localStorage.getItem('krypto-mode'); if (m && MODE_PLACEHOLDER[m]) kMode = m; } catch {}
    // Uppdatera bara UI:t (chips + placeholder) för ett läge, utan att byta samtal.
    function applyModeUI(m) {
      if (!MODE_PLACEHOLDER[m]) return;
      kMode = m; try { localStorage.setItem('krypto-mode', m); } catch {}
      document.querySelectorAll('#modes .modechip').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
      if (inp) inp.placeholder = MODE_PLACEHOLDER[m];
    }
    // Byt läge = byt till det lägets egen chatt-tråd (eller skapa en ny). Varje läge tänker på olika saker.
    function switchToMode(m) {
      if (!MODE_PLACEHOLDER[m] || m === kMode) { applyModeUI(m); return; }
      saveConvos();
      const target = convos.filter((c) => (c.mode || 'fraga') === m).sort((a, b) => b.ts - a.ts)[0];
      if (target) { activeId = target.id; history = target.messages; }
      else { const c = { id: cid(), title: 'Nytt samtal', ts: Date.now(), messages: [], mode: m }; convos.push(c); activeId = c.id; history = c.messages; }
      applyModeUI(m); saveConvos(); updateConvTitle(); render(); scrollBottom();
    }
    document.querySelectorAll('#modes .modechip').forEach((b) => b.addEventListener('click', () => switchToMode(b.dataset.mode)));
    // Fråga från "Var ska jag börja?"-quizet: byt till Fråga-läge, fyll i och skicka.
    if (window.krypto && window.krypto.onPrefill) window.krypto.onPrefill((t) => {
      if (!t || busy) return;
      try { switchToMode('fraga'); } catch {}
      inp.value = t; try { autosize(); } catch {}
      try { send(); } catch {}
    });

    /* ── Priming + minnestaggar ── */
    function buildPriming() {
      const mems = memGet();
      const memList = mems.length ? mems.map((m, i) => (i + 1) + '. ' + m.text).join('\n') : '(inga minnen än)';
      const sys =
        'KONTEXT (visas inte för användaren): Du är Krypto, den personliga säkerhetsassistenten inuti **Vaka** – ' +

        '• Handla åt användaren med deras sparade kort — BARA när de tydligt ber om att köpa/beställa något (t.ex. "köp en pizza"): [[gör:köp=vad (ev. hämtning/leverans)|butik|ungefärligt belopp]] — t.ex. [[gör:köp=Pizza Margherita, hämtning|Pizzerian|129 kr]]. Ange ett rimligt belopp om inget nämnts. Webbläsaren kräver användarens tillstånd + en bekräftelse innan betalning — så LOVA aldrig att köpet är genomfört, säg bara kort att du förbereder det. Skriv aldrig ut taggen.\n' +
        '• Tillåt en sida för ett barn — permanent ELLER tillfälligt: [[gör:tillat=BARNETS_NAMN|sida.se|MINUTER]] — sista delen (minuter) valfri för TILLFÄLLIG åtkomst som sen återblockeras. Ex permanent: [[gör:tillat=Emma|roblox.com]]. Ex tillfälligt en timme: [[gör:tillat=Emma|roblox.com|60]]. "en timme"=60, "en halvtimme"=30, "två timmar"=120. Bara föräldern kan tillåta.\n' +
        'Utför BARA det användaren faktiskt ber om. Skriv aldrig ut själva taggen som synlig text.\n\n' +
        'Sparade minnen om användaren just nu:\n' + memList;
      return [
        { role: 'user', content: sys },
        { role: 'assistant', content: 'Uppfattat – jag är Krypto, din säkerhetsassistent i Vaka, och håller mina minnen om dig uppdaterade.' },

    function processMemoryTags(reply) {
      const events = []; let recalled = false; let out = reply;
      out = out.replace(/\[\[\s*minne\s*\+\s*([\s\S]+?)\]\]/gi, (_m, t) => { const r = memAdd(t.trim()); if (r) events.push({ kind: 'add', text: r.text }); return ''; });
      out = out.replace(/\[\[\s*minne\s*[-–]\s*([\s\S]+?)\]\]/gi, (_m, t) => { const r = memDelByText(t.trim()); if (r) events.push({ kind: 'del', text: r.text }); return ''; });
      out = out.replace(/\[\[\s*minne\s*\?\s*\]\]/gi, () => { recalled = true; return ''; });
      out = out.replace(/\n{3,}/g, '\n\n').trim();
      return { text: out, events, recalled };
    }
    function processActionTags(reply) {
      const actions = [];
      const out = reply.replace(/\[\[\s*gör\s*:\s*([a-zA-ZåäöÅÄÖ_]+)\s*(?:=\s*([^\]]+?))?\s*\]\]/gi, (_m, name, val) => {
        const a = { name: name.trim().toLowerCase(), value: (val || '').trim() };
        actions.push(a); try { window.krypto.doAction(a); } catch {}
        return '';
      }).replace(/\n{3,}/g, '\n\n').trim();
      return { text: out, actions };
    }

    /* ── Skicka ── */
    async function send() {
      const text = inp.value.trim();
      if (!text || busy) return;
      if (text[0] === '/' && runCommand(text)) { inp.value = ''; autosize(); hideCmd(); return; }
      inp.value = ''; autosize(); hideCmd();
      history.push({ role: 'user', content: text }); touchConvo(text); saveConvos();
      { const h = log.querySelector('.hero'); if (h) h.remove(); }   // välkomstvyn försvinner när samtalet börjar
      bubble('user', fmt(text)); updateConvTitle();
      busy = true; sendBtn.disabled = true; document.body.classList.add('thinking');
      const typing = bubble('krypto', '<span class="think">' + OWL_FLY + '<span class="tt">' + esc((typeof window.t === 'function') ? window.t('Krypto tänker') : 'Krypto tänker') + '…</span></span>', 'typing');
      const messages = buildPriming().concat(history.slice(-12));
      let res;
      try { res = await window.krypto.chat(messages); }
      catch { res = { ok: false, message: 'Kunde inte nå Krypto just nu.' }; }
      typing.remove(); document.body.classList.remove('thinking');
      if (res && res.ok) {
        const { text: clean0, events, recalled } = processMemoryTags(res.reply || '');
        const { text: clean } = processActionTags(clean0);
        if (recalled) recallChip();
        bubble('krypto', fmt(clean || '(tomt svar)'));
        history.push({ role: 'assistant', content: clean }); saveConvos();
        for (const ev of events) memCard(ev.kind, ev.text);
      } else {
        history.pop(); saveConvos();
        bubble('krypto', fmt((res && res.message) || 'Något gick fel. Försök igen om en stund.'));
      }
      busy = false; sendBtn.disabled = false; inp.focus();
    }

    /* ── Kommandon ── */
    const COMMANDS = [
      { name: '/nytt', desc: 'Starta ett nytt samtal', run: newConvo },
      { name: '/samtal', desc: 'Visa alla dina samtal', run: () => togglePanel('convpanel', true) },
      { name: '/minne', desc: 'Visa & ändra vad Krypto minns', run: () => togglePanel('mempanel', true) },
    ];
    function runCommand(text) {
      const cmd = text.trim().toLowerCase().split(/\s+/)[0];
      const c = COMMANDS.find((x) => x.name === cmd);
      if (c) { c.run(); return true; }
      return false;
    }
    let cmdSel = 0;
    function showCmd() {
      const v = inp.value;
      if (v[0] !== '/' || v.includes('\n')) return hideCmd();
      const q = v.trim().toLowerCase();
      const matches = COMMANDS.filter((c) => c.name.startsWith(q) || q === '/');
      if (!matches.length) return hideCmd();
      cmdSel = Math.min(cmdSel, matches.length - 1);
      const box = $('cmdhint');
      box.innerHTML = matches.map((c, i) => '<div class="cmd' + (i === cmdSel ? ' sel' : '') + '" data-cmd="' + c.name + '"><span class="cname">' + c.name + '</span><span class="cdesc">' + c.desc + '</span></div>').join('');
      box.classList.add('on');
      box.querySelectorAll('.cmd').forEach((el) => el.addEventListener('mousedown', (e) => { e.preventDefault(); const c = COMMANDS.find((x) => x.name === el.dataset.cmd); inp.value = ''; autosize(); hideCmd(); if (c) c.run(); }));
    }
    function hideCmd() { $('cmdhint').classList.remove('on'); cmdSel = 0; }
    function cmdVisible() { return $('cmdhint').classList.contains('on'); }
    function cmdMatches() { const q = inp.value.trim().toLowerCase(); return COMMANDS.filter((c) => c.name.startsWith(q) || q === '/'); }

    /* ── Paneler ── */
    function closePanels() { $('convpanel').classList.remove('on'); $('mempanel').classList.remove('on'); }
    function togglePanel(id, open) {
      const willOpen = open === undefined ? !$(id).classList.contains('on') : open;
      closePanels();
      if (willOpen) { $(id).classList.add('on'); if (id === 'convpanel') renderConvList(); else renderMemList(); }
    }
    function ago(ts) { const s = (Date.now() - ts) / 1000; if (s < 60) return 'nyss'; if (s < 3600) return Math.floor(s / 60) + ' min sedan'; if (s < 86400) return Math.floor(s / 3600) + ' h sedan'; return Math.floor(s / 86400) + ' d sedan'; }
    function renderConvList() {
      const host = $('convlist'); host.innerHTML = '';
      const ordered = convos.slice().sort((a, b) => b.ts - a.ts);
      if (ordered.length === 1 && !ordered[0].messages.length) { host.innerHTML = '<div class="p-empty">Inga tidigare samtal än.<br>Skriv något till Krypto så dyker de upp här.</div>'; return; }
      for (const c of ordered) {
        const row = document.createElement('div'); row.className = 'convrow' + (c.id === activeId ? ' active' : '');
        const preview = (MODE_LABEL[c.mode || 'fraga'] || 'Fråga') + ' · ' + (c.messages.length) + ' meddelanden · ' + ago(c.ts);
        row.innerHTML = '<span class="ci"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>'
          + '<div class="cmeta"><div class="ctitle">' + esc(c.title || 'Nytt samtal') + '</div><div class="csub">' + preview + '</div></div>'
          + '<button class="del" title="Ta bort samtal"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>';
        row.addEventListener('click', (e) => { if (e.target.closest('.del')) { e.stopPropagation(); row.classList.add('leaving'); setTimeout(() => deleteConvo(c.id), 380); } else openConvo(c.id); });
        host.appendChild(row);
      }
    }
    function renderMemList() {
      const list = memGet(); const host = $('mplist'); host.innerHTML = '';
      if (!list.length) { host.innerHTML = '<div class="p-empty">Krypto har inga minnen om dig än.<br>Lägg till något själv nedan, eller berätta något i chatten.</div>'; return; }
      for (const m of list.slice().reverse()) {
        const row = document.createElement('div'); row.className = 'mprow';
        row.innerHTML = '<div class="mv">' + esc(m.text) + '</div>'
          + '<button class="ib edit" title="Ändra"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'
          + '<button class="ib del" title="Ta bort"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>';
        const mv = row.querySelector('.mv');
        function beginEdit() {
          mv.setAttribute('contenteditable', 'true'); mv.focus();
          const r = document.createRange(); r.selectNodeContents(mv); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        }
        function commit() { mv.removeAttribute('contenteditable'); const t = mv.textContent.trim(); if (t && t !== m.text) memEdit(m.id, t); else if (!t) { memDelById(m.id); } if (!t || t !== m.text) renderMemList(); }
        row.querySelector('.edit').addEventListener('click', beginEdit);
        mv.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); mv.blur(); } if (e.key === 'Escape') { mv.textContent = m.text; mv.blur(); } });
        mv.addEventListener('blur', commit);
        row.querySelector('.del').addEventListener('click', () => { row.classList.add('leaving'); setTimeout(() => { memDelById(m.id); }, 380); });
        host.appendChild(row);
      }
    }

    /* ── Inmatning ── */
    function autosize() { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight) + 'px'; }
    inp.addEventListener('input', () => { autosize(); showCmd(); });
    inp.addEventListener('keydown', (e) => {
      if (cmdVisible()) {
        const m = cmdMatches();
        if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = (cmdSel + 1) % m.length; showCmd(); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = (cmdSel - 1 + m.length) % m.length; showCmd(); return; }
        if (e.key === 'Escape') { hideCmd(); return; }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const c = m[cmdSel]; inp.value = ''; autosize(); hideCmd(); if (c) c.run(); return; }
        if (e.key === 'Tab') { e.preventDefault(); const c = m[cmdSel]; if (c) { inp.value = c.name + ' '; showCmd(); } return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    inp.addEventListener('blur', () => setTimeout(hideCmd, 150));
    sendBtn.addEventListener('click', send);

    $('newchat').addEventListener('click', newConvo);
    $('convbtn').addEventListener('click', () => togglePanel('convpanel'));
    $('membtn').addEventListener('click', () => togglePanel('mempanel'));
    // Helskärm på/av — panelen täcker hela webbytan (skönare för långa rapporter).
    let kFull = false;
    function applyFull(f) {
      kFull = !!f;
      $('full-ic-open').style.display = kFull ? 'none' : '';
      $('full-ic-close').style.display = kFull ? '' : 'none';
      $('fullbtn').title = kFull ? 'Lämna helskärm' : 'Helskärm';
      document.body.classList.toggle('full', kFull);
    }
    $('fullbtn').addEventListener('click', () => { applyFull(!kFull); try { window.krypto.expand(kFull); } catch {} });
    $('convclose').addEventListener('click', closePanels);
    $('memclose').addEventListener('click', closePanels);
    $('conv-new').addEventListener('click', newConvo);
    $('memadd-btn').addEventListener('click', () => { const v = $('memadd-inp').value.trim(); if (v && memAdd(v)) { $('memadd-inp').value = ''; renderMemList(); } });
    $('memadd-inp').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('memadd-btn').click(); } });

    /* ── Start ── */
    loadConvos(); applyModeUI((activeConvo() && activeConvo().mode) || kMode); updateBadge(); updateConvTitle(); render();
    setTimeout(() => inp.focus(), 60);
  </script>
</body>
</html>
